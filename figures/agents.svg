<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" font-family="Inter, sans-serif" role="img"><defs><marker id="agents-ah-4b5868-7_5" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.2,5 z" fill="#4b5868"/></marker><marker id="agents-ah-0a6f69-7_5" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.2,5 z" fill="#0a6f69"/></marker><marker id="agents-ah-0a6f69-6" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.2,5 z" fill="#0a6f69"/></marker></defs><circle cx="73.0" cy="129.0" r="48.0" fill="#00958c" opacity="0.13"/><circle cx="73.0" cy="129.0" r="48.0" fill="none" stroke="#00958c" stroke-width="1.2"/><circle cx="127.0" cy="129.0" r="48.0" fill="#5d52d4" opacity="0.13"/><circle cx="127.0" cy="129.0" r="48.0" fill="none" stroke="#5d52d4" stroke-width="1.2"/><circle cx="100.0" cy="175.0" r="48.0" fill="#e05a28" opacity="0.13"/><circle cx="100.0" cy="175.0" r="48.0" fill="none" stroke="#e05a28" stroke-width="1.2"/><text x="54.0" y="70.0" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="middle">Private data</text><text x="150.0" y="58.0" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="150.0" dy="0.00">Untrusted</tspan><tspan x="150.0" dy="10.81">content</tspan></text><text x="100.0" y="240.0" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="100.0" dy="0.00">A way to send</tspan><tspan x="100.0" dy="10.81">data out</tspan></text><circle cx="100.0" cy="148.0" r="3.2" fill="#13283f"/><text x="8.0" y="20.0" font-size="9.4" font-weight="600" fill="#4b5868" text-anchor="start">(a) The dangerous combination</text><text x="8.0" y="270.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="8.0" dy="0.00">An agent with all three can be</tspan><tspan x="8.0" dy="10.82">steered into leaking. It needs a</tspan><tspan x="8.0" dy="10.82">boundary outside the model.</tspan></text><line x1="212.0" y1="10.0" x2="212.0" y2="308.0" stroke="#e2e7ec" stroke-width="1.0" stroke-linecap="butt"/><text x="226.0" y="20.0" font-size="9.4" font-weight="600" fill="#4b5868" text-anchor="start">(b) Contain the agent outside the model</text><rect x="352.0" y="30.0" width="196.0" height="168.0" rx="9" fill="#fcebe3" /><text x="360.0" y="43.0" font-size="8" font-weight="600" fill="#b8461c" text-anchor="start">model output is untrusted</text><rect x="226.0" y="46.0" width="104.0" height="46.0" rx="6" fill="#e9eff3" /><text x="278.0" y="66.1" font-size="9.6" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="278.0" dy="0.00">Authenticated</tspan><tspan x="278.0" dy="11.71">user</tspan></text><rect x="360.0" y="48.0" width="180.0" height="50.0" rx="6" fill="#ffffff" stroke="#e05a28" stroke-width="1.0" /><text x="368.0" y="64.4" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Planner model</text><text x="368.0" y="79.4" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start">sees only the trusted request</text><rect x="420.0" y="112.0" width="120.0" height="74.0" rx="6" fill="#ffffff" stroke="#e05a28" stroke-width="1.0" /><text x="428.0" y="128.4" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Reader model</text><text x="428.0" y="143.4" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="428.0" dy="0.00">reads untrusted content;</tspan><tspan x="428.0" dy="10.82">no tools; returns</tspan><tspan x="428.0" dy="10.82">labelled values</tspan></text><rect x="564.0" y="112.0" width="104.0" height="52.0" rx="6" fill="#e9eff3" /><text x="616.0" y="127.5" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="616.0" dy="0.00">Untrusted</tspan><tspan x="616.0" dy="11.47">content</tspan></text><text x="616.0" y="153.9" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="middle">web, email, files</text><rect x="360.0" y="214.0" width="180.0" height="66.0" rx="6" fill="#e2f3f1" stroke="#00958c" stroke-width="1.0" /><text x="368.0" y="230.4" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Tool gateway</text><text x="368.0" y="245.4" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="368.0" dy="0.00">deterministic policy</tspan><tspan x="368.0" dy="10.82">provenance labels · budgets</tspan><tspan x="368.0" dy="10.82">task-scoped delegation</tspan></text><rect x="226.0" y="222.0" width="104.0" height="50.0" rx="6" fill="#f4f7f9" /><text x="278.0" y="237.0" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="278.0" dy="0.00">Human</tspan><tspan x="278.0" dy="11.47">confirmation</tspan></text><text x="278.0" y="263.5" font-size="7.8" font-weight="400" fill="#4b5868" text-anchor="middle">shown by the gateway</text><rect x="564.0" y="214.0" width="104.0" height="30.0" rx="6" fill="#f4f7f9" /><text x="616.0" y="231.8" font-size="9.0" font-weight="600" fill="#13283f" text-anchor="middle">Credential broker</text><rect x="564.0" y="252.0" width="104.0" height="30.0" rx="6" fill="#e9eff3" /><text x="616.0" y="269.8" font-size="9.0" font-weight="600" fill="#13283f" text-anchor="middle">Tools &amp; resources</text><rect x="556.0" y="206.0" width="120.0" height="84.0" rx="8" fill="none" stroke="#4b5868" stroke-width="1" stroke-dasharray="3 3" /><text x="616.0" y="302.0" font-size="8" font-weight="400" fill="#7b8794" text-anchor="middle">egress allow-list</text><path d="M330.0,71.0 L360.0,71.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-4b5868-7_5)"/><text x="345.0" y="65.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="middle">task</text><path d="M564.0,138.0 L541.0,138.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-4b5868-7_5)"/><path d="M384.0,98.0 L384.0,212.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-4b5868-7_5)"/><text x="390.0" y="158.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="start">plan</text><path d="M500.0,186.0 L500.0,212.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-4b5868-7_5)"/><text x="506.0" y="206.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="start">values</text><path d="M360.0,247.0 L332.0,247.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-4b5868-7_5)" marker-start="url(#agents-ah-4b5868-7_5)"/><path d="M540.0,229.0 L564.0,229.0" fill="none" stroke="#0a6f69" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-0a6f69-7_5)"/><path d="M616.0,244.0 L616.0,251.0" fill="none" stroke="#0a6f69" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#agents-ah-0a6f69-6)"/><text x="226.0" y="112.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="226.0" dy="0.00">Secrets never enter a</tspan><tspan x="226.0" dy="10.82">prompt, a model's</tspan><tspan x="226.0" dy="10.82">memory or a tool</tspan><tspan x="226.0" dy="10.82">result. The broker</tspan><tspan x="226.0" dy="10.82">injects them per call.</tspan></text></svg>