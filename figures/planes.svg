.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Authorization</text><text x="410.0" y="48.8" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="410.0" dy="0.00">policy engine (OPA) · token exchange</tspan><tspan x="410.0" dy="11.35">credential broker · budgets</tspan></text><rect x="8.0" y="146.0" width="428.0" height="102.0" rx="9" fill="#fcebe3" /><rect x="14.0" y="154.0" width="416.0" height="72.0" rx="6" fill="#ffffff" stroke="#e05a28" stroke-width="1.3" /><text x="26.0" y="178.0" font-size="11" font-weight="600" fill="#13283f" text-anchor="start">Workload instance</text><text x="26.0" y="195.0" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="26.0" dy="0.00">Runs approved code. Holds no authority it can extend,</tspan><tspan x="26.0" dy="11.01">renew or restore on its own.</tspan></text><text x="18.0" y="242.0" font-size="8.4" font-weight="600" fill="#b8461c" text-anchor="start">may be compromised</text><rect x="470.0" y="154.0" width="120.0" height="72.0" rx="6" fill="#f4f7f9" /><text x="479.0" y="172.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Enforcement</text><text x="479.0" y="187.8" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="479.0" dy="0.00">Envoy ext_authz</tspan><tspan x="479.0" dy="11.35">DB policy</tspan><tspan x="479.0" dy="11.35">guest supervisor</tspan></text><rect x="608.0" y="154.0" width="58.0" height="72.0" rx="6" fill="#e9eff3" /><text x="637.0" y="192.9" font-size="9.2" font-weight="600" fill="#13283f" text-anchor="middle">Resource</text><path d="M164.0,48.0 L186.0,48.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><path d="M378.0,48.0 L400.0,48.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><path d="M78.0,84.0 L78.0,152.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><text x="84.0" y="122.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="start">approved digest</text><path d="M232.0,154.0 L232.0,86.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><text x="238.0" y="122.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="start">fresh evidence</text><path d="M414.0,84.0 L414.0,152.0" fill="none" stroke="#0a6f69" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-0a6f69-7_5)"/><text x="408.0" y="122.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="end">permit (lease)</text><path d="M530.0,84.0 L530.0,152.0" fill="none" stroke="#0a6f69" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-0a6f69-7_5)"/><text x="536.0" y="122.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="start">policy · epoch</text><path d="M430.0,190.0 L470.0,190.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><text x="450.0" y="183.0" font-size="7.6" font-weight="400" fill="#7b8794" text-anchor="middle">request</text><text x="450.0" y="204.0" font-size="7.6" font-weight="400" fill="#7b8794" text-anchor="middle">+ permit</text><path d="M590.0,190.0 L608.0,190.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-6_5)"/><rect x="470.0" y="262.0" width="196.0" height="52.0" rx="6" fill="#f4f7f9" /><text x="479.0" y="280.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Observation &amp; revocation</text><text x="479.0" y="295.8" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start">audit · signed events · epoch acks</text><path d="M504.0,262.0 L504.0,228.0" fill="none" stroke="#e05a28" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-e05a28-7_5)"/><text x="498.0" y="252.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="end">revoke</text><path d="M556.0,226.0 L556.0,260.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#planes-ah-4b5868-7_5)"/><text x="562.0" y="252.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="start">decisions</text><rect x="14.0" y="326.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#13283f" stroke-width="1" stroke-dasharray="3 3" /><text x="26.0" y="347.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Recovery &amp; governance</text><text x="176.0" y="347.0" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start">Separate accounts, keys and backups. Can rebuild every plane above without production credentials.</text><text x="14.0" y="292.0" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start" font-style="italic">Everything outside the coral zone decides, enforces or restores. The workload never does.</text></svg>