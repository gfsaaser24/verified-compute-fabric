<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 198" width="680" height="198" font-family="Inter, sans-serif" role="img"><defs><marker id="failure-ah-4b5868-6_5" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.2,5 z" fill="#4b5868"/></marker><marker id="failure-ah-5d52d4-6_5" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 L2.2,5 z" fill="#5d52d4"/></marker></defs><rect x="14.0" y="50.0" width="138.0" height="64.0" rx="7" fill="#ffffff" stroke="#00958c" stroke-width="1.6" /><text x="28.0" y="70.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Normal</text><text x="28.0" y="86.0" font-size="8.3" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="28.0" dy="0.00">current policy and epoch;</tspan><tspan x="28.0" dy="10.96">leases renew with evidence</tspan></text><rect x="185.0" y="50.0" width="138.0" height="64.0" rx="7" fill="#ffffff" stroke="#b7791f" stroke-width="1.6" /><text x="199.0" y="70.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Degraded</text><text x="199.0" y="86.0" font-size="8.3" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="199.0" dy="0.00">authenticated cached policy,</tspan><tspan x="199.0" dy="10.96">only within its validity</tspan></text><rect x="356.0" y="50.0" width="138.0" height="64.0" rx="7" fill="#ffffff" stroke="#e05a28" stroke-width="1.6" /><text x="370.0" y="70.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Restricted</text><text x="370.0" y="86.0" font-size="8.3" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="370.0" dy="0.00">no new privileged authority;</tspan><tspan x="370.0" dy="10.96">existing leases run out</tspan></text><rect x="527.0" y="50.0" width="138.0" height="64.0" rx="7" fill="#ffffff" stroke="#5d52d4" stroke-width="1.6" /><text x="541.0" y="70.0" font-size="10.5" font-weight="600" fill="#13283f" text-anchor="start">Recovery</text><text x="541.0" y="86.0" font-size="8.3" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="541.0" dy="0.00">re-establish time, epoch</tspan><tspan x="541.0" dy="10.96">and issuers; audit it</tspan></text><path d="M154.0,82.0 L183.0,82.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#failure-ah-4b5868-6_5)"/><text x="168.5" y="32.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="middle"><tspan x="168.5" dy="0.00">policy service</tspan><tspan x="168.5" dy="9.36">unreachable</tspan></text><path d="M325.0,82.0 L354.0,82.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#failure-ah-4b5868-6_5)"/><text x="339.5" y="32.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="middle"><tspan x="339.5" dy="0.00">cache validity</tspan><tspan x="339.5" dy="9.36">expires</tspan></text><path d="M496.0,82.0 L525.0,82.0" fill="none" stroke="#4b5868" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#failure-ah-4b5868-6_5)"/><text x="510.5" y="32.0" font-size="7.8" font-weight="400" fill="#7b8794" text-anchor="middle"><tspan x="510.5" dy="0.00">clock or epoch lost,</tspan><tspan x="510.5" dy="9.36">controller compromised</tspan></text><path d="M596.0,114.0 C596.0,148 83.0,148 83.0,116" fill="none" stroke="#5d52d4" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#failure-ah-5d52d4-6_5)"/><text x="339.5" y="158.0" font-size="8.4" font-weight="400" fill="#4b5868" text-anchor="middle">rejoin only through the same admission checks as a new instance</text><text x="14.0" y="192.0" font-size="8.6" font-weight="600" fill="#13283f" text-anchor="start">No transition extends authority to keep a service up. Silent fail-open is not a state.</text></svg>