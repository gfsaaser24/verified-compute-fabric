<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" width="680" height="278" font-family="Inter, sans-serif" role="img"><defs></defs><path d="M14.0,190 L14.0,168 Q14.0,164 18.0,164 L110.0,164 Q114.0,164 114.0,168 L114.0,190 Z" fill="#9fd9d3" /><text x="16.0" y="140.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start"><tspan x="16.0" dy="0.00">Baseline</tspan><tspan x="16.0" dy="11.76">inventory</tspan></text><text x="16.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="16.0" dy="0.00">workloads, admins</tspan><tspan x="16.0" dy="10.66">and every direct</tspan><tspan x="16.0" dy="10.66">backend path known</tspan></text><text x="106.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">1</text><path d="M124.0,190 L124.0,146 Q124.0,142 128.0,142 L220.0,142 Q224.0,142 224.0,146 L224.0,190 Z" fill="#6cc6bd" /><text x="126.0" y="118.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start"><tspan x="126.0" dy="0.00">Release</tspan><tspan x="126.0" dy="11.76">integrity</tspan></text><text x="126.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="126.0" dy="0.00">exact digests; altered</tspan><tspan x="126.0" dy="10.66">artifacts and config</tspan><tspan x="126.0" dy="10.66">are rejected</tspan></text><text x="216.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">2</text><path d="M234.0,190 L234.0,124 Q234.0,120 238.0,120 L330.0,120 Q334.0,120 334.0,124 L334.0,190 Z" fill="#36ada3" /><text x="236.0" y="96.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start"><tspan x="236.0" dy="0.00">Bounded</tspan><tspan x="236.0" dy="11.76">authorization</tspan></text><text x="236.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="236.0" dy="0.00">brokered, scoped</tspan><tspan x="236.0" dy="10.66">credentials; tenant</tspan><tspan x="236.0" dy="10.66">boundary tests pass</tspan></text><text x="326.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">3</text><path d="M344.0,190 L344.0,102 Q344.0,98 348.0,98 L440.0,98 Q444.0,98 444.0,102 L444.0,190 Z" fill="#00958c" /><text x="346.0" y="74.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start"><tspan x="346.0" dy="0.00">Revocation</tspan><tspan x="346.0" dy="11.76">&amp; recovery</tspan></text><text x="346.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="346.0" dy="0.00">sessions end under</tspan><tspan x="346.0" dy="10.66">partition; restore</tspan><tspan x="346.0" dy="10.66">without prod admin</tspan></text><text x="436.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">4</text><path d="M454.0,190 L454.0,80 Q454.0,76 458.0,76 L550.0,76 Q554.0,76 554.0,80 L554.0,190 Z" fill="#5d52d4" /><text x="456.0" y="52.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start"><tspan x="456.0" dy="0.00">Hardware</tspan><tspan x="456.0" dy="11.76">profile</tspan></text><text x="456.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="456.0" dy="0.00">launch binding</tspan><tspan x="456.0" dy="10.66">verified; stale</tspan><tspan x="456.0" dy="10.66">evidence rejected</tspan></text><text x="546.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">5</text><path d="M564.0,190 L564.0,58 Q564.0,54 568.0,54 L660.0,54 Q664.0,54 664.0,58 L664.0,190 Z" fill="#0a6f69" /><text x="566.0" y="44.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Federation</text><text x="566.0" y="208.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="start"><tspan x="566.0" dy="0.00">partner issuer</tspan><tspan x="566.0" dy="10.66">scope; bilateral</tspan><tspan x="566.0" dy="10.66">revocation drills</tspan></text><text x="656.0" y="182.0" font-size="10" font-weight="700" fill="#ffffff" text-anchor="end">6</text><line x1="10.0" y1="190.0" x2="670.0" y2="190.0" stroke="#c3ccd4" stroke-width="1.0" stroke-linecap="butt"/><text x="14.0" y="18.0" font-size="9" font-weight="600" fill="#0a6f69" text-anchor="start"><tspan x="14.0" dy="0.00">Start with one sensitive operation.</tspan><tspan x="14.0" dy="11.70">Expand only after its gate passes.</tspan></text><text x="462.0" y="92.0" font-size="7.8" font-weight="600" fill="#ffffff" text-anchor="start"><tspan x="462.0" dy="0.00">only if the threat</tspan><tspan x="462.0" dy="9.75">model includes</tspan><tspan x="462.0" dy="9.75">the host</tspan></text><text x="14.0" y="270.0" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start" font-style="italic">Each gate publishes its residual risk and the evidence needed to pass the next one. A date on a plan is not evidence.</text></svg>