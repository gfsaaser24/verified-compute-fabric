<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" font-family="Inter, sans-serif" role="img"><defs><pattern id="profiles-hatch-coral" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#e05a28" stroke-width="1.2" stroke-opacity="0.55"/></pattern><pattern id="profiles-hatch-gray" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#a9b4bf" stroke-width="1" stroke-opacity="0.7"/></pattern></defs><text x="14.0" y="16.0" font-size="10.8" font-weight="600" fill="#13283f" text-anchor="start">Managed-host profile</text><text x="14.0" y="30.0" font-size="8.4" font-weight="400" fill="#7b8794" text-anchor="start">contains application compromise</text><rect x="14.0" y="52.0" width="206.0" height="40.0" rx="5" fill="#fcebe3" stroke="#e05a28" stroke-width="1.3" /><text x="117.0" y="75.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Application</text><rect x="14.0" y="100.0" width="206.0" height="34.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="117.0" y="120.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Container runtime or sandbox</text><rect x="14.0" y="142.0" width="206.0" height="34.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="117.0" y="162.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Host kernel and administrator</text><rect x="14.0" y="184.0" width="206.0" height="34.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="117.0" y="204.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Hardware and firmware</text><rect x="230.0" y="52.0" width="96.0" height="166.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="278.0" y="70.0" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="278.0" dy="0.00">Fabric services</tspan><tspan x="278.0" dy="10.56">off the workload</tspan></text><text x="278.0" y="100.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="middle"><tspan x="278.0" dy="0.00">gateway · broker</tspan><tspan x="278.0" dy="10.40">verifier · policy</tspan><tspan x="278.0" dy="10.40">audit</tspan></text><text x="354.0" y="16.0" font-size="10.8" font-weight="600" fill="#13283f" text-anchor="start">Host-adversarial profile</text><text x="354.0" y="30.0" font-size="8.4" font-weight="400" fill="#7b8794" text-anchor="start">adds a protected guest the host cannot read</text><rect x="354.0" y="48.0" width="206.0" height="96.0" rx="7" fill="none" stroke="#5d52d4" stroke-width="1.4" /><text x="362.0" y="61.0" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="start">Confidential guest</text><rect x="362.0" y="64.0" width="190.0" height="34.0" rx="5" fill="#ffffff" stroke="#e05a28" stroke-width="1.3" /><rect x="362.0" y="64.0" width="190.0" height="34.0" rx="5" fill="url(#profiles-hatch-coral)" /><text x="457.0" y="84.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Application</text><rect x="362.0" y="104.0" width="190.0" height="32.0" rx="5" fill="#e2f3f1" stroke="#00958c" stroke-width="1.3" /><text x="457.0" y="123.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Guest supervisor (attested)</text><rect x="354.0" y="152.0" width="206.0" height="34.0" rx="5" fill="#fcebe3" stroke="#e05a28" stroke-width="1.3" /><text x="457.0" y="172.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Host kernel, hypervisor, admin</text><rect x="354.0" y="194.0" width="206.0" height="24.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="457.0" y="209.4" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle">Hardware and TEE firmware</text><rect x="570.0" y="52.0" width="96.0" height="166.0" rx="5" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="618.0" y="70.0" font-size="8.8" font-weight="600" fill="#13283f" text-anchor="middle"><tspan x="618.0" dy="0.00">Fabric services</tspan><tspan x="618.0" dy="10.56">off the workload</tspan></text><text x="618.0" y="100.0" font-size="8" font-weight="400" fill="#4b5868" text-anchor="middle"><tspan x="618.0" dy="0.00">gateway · broker</tspan><tspan x="618.0" dy="10.40">verifier · policy</tspan><tspan x="618.0" dy="10.40">audit</tspan></text><rect x="354.0" y="226.0" width="312.0" height="20.0" rx="5" fill="url(#profiles-hatch-gray)" /><text x="510.0" y="240.0" font-size="8.2" font-weight="400" fill="#4b5868" text-anchor="middle">outside the claim: physical memory attacks · denial of service</text><line x1="14.0" y1="262.0" x2="666.0" y2="262.0" stroke="#e2e7ec" stroke-width="1.0" stroke-linecap="butt"/><rect x="14.0" y="270.0" width="18.0" height="12.0" rx="3" fill="#ffffff" stroke="#00958c" stroke-width="1.3" /><text x="38.0" y="279.4" font-size="8.6" font-weight="400" fill="#1e2b3a" text-anchor="start">Trusted</text><rect x="99.0" y="270.0" width="18.0" height="12.0" rx="3" fill="#e2f3f1" stroke="#00958c" stroke-width="1.3" /><text x="123.0" y="279.4" font-size="8.6" font-weight="400" fill="#1e2b3a" text-anchor="start">Verified by attestation</text><rect x="264.0" y="270.0" width="18.0" height="12.0" rx="3" fill="#fcebe3" stroke="#e05a28" stroke-width="1.3" /><text x="288.0" y="279.4" font-size="8.6" font-weight="400" fill="#1e2b3a" text-anchor="start">Attacker-controlled</text><rect x="409.0" y="270.0" width="18.0" height="12.0" rx="3" fill="#ffffff" stroke="#e05a28" stroke-width="1.3" /><rect x="409.0" y="270.0" width="18.0" height="12.0" rx="3" fill="url(#profiles-hatch-coral)" /><text x="433.0" y="279.4" font-size="8.6" font-weight="400" fill="#1e2b3a" text-anchor="start">May be compromised</text><rect x="549.0" y="270.0" width="18.0" height="12.0" rx="3" fill="url(#profiles-hatch-gray)" /><text x="573.0" y="279.4" font-size="8.6" font-weight="400" fill="#1e2b3a" text-anchor="start">Outside the claim</text><text x="14.0" y="306.0" font-size="8.6" font-weight="400" fill="#4b5868" text-anchor="start" font-style="italic">In both profiles the authority to admit, permit and revoke sits in the teal boxes on the right, never in a coral one.</text></svg>