<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232" font-family="Inter, sans-serif" role="img"><defs></defs><text x="14.0" y="44.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Push path</text><text x="14.0" y="57.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">enforcer receives the event</text><rect x="176.0" y="34.0" width="52.0" height="22.0" rx="3" fill="#00958c" /><text x="202.0" y="48.8" font-size="8.4" font-weight="600" fill="#ffffff" text-anchor="middle">D</text><rect x="230.0" y="34.0" width="62.0" height="22.0" rx="3" fill="#0a6f69" /><text x="261.0" y="48.8" font-size="8.4" font-weight="600" fill="#ffffff" text-anchor="middle">A</text><line x1="292.0" y1="30.0" x2="292.0" y2="60.0" stroke="#13283f" stroke-width="1.4" stroke-linecap="butt"/><text x="14.0" y="94.0" font-size="9.8" font-weight="600" fill="#13283f" text-anchor="start">Expiry path, leaf only</text><text x="14.0" y="107.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">only the permit is checked at use</text><rect x="176.0" y="84.0" width="236.0" height="22.0" rx="3" fill="#5b6b7c" /><text x="183.0" y="98.8" font-size="8.4" font-weight="600" fill="#ffffff" text-anchor="start">R  issuer keeps minting until its own lease ends</text><rect x="414.0" y="84.0" width="144.0" height="22.0" rx="3" fill="#8795a3" /><text x="421.0" y="98.8" font-size="8.4" font-weight="600" fill="#ffffff" text-anchor="start">P  last permit lives on</text><rect x="560.0" y="84.0" width="12.0" height="22.0" rx="3" fill="#a9b4bf" /><text x="566.0" y="98.8" font-size="8.4" font-weight="600" fill="#13283f" text-anchor="middle">S</text><rect x="574.0" y="84.0" width="24.0" height="22.0" rx="3" fill="#c6cfd8" /><text x="586.0" y="98.8" font-size="8.4" font-weight="600" fill="#13283f" text-anchor="middle">C</text><line x1="598.0" y1="80.0" x2="598.0" y2="110.0" stroke="#13283f" stroke-width="1.4" stroke-linecap="butt"/><text x