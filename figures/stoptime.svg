34.0 612.4,38.0 L612.4,48.0 Q612.4,52.0 608.4,52.0 L236.0,52.0 Z" fill="#a9b4bf" /><text x="618.4" y="46.8" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="start">90 d</text><text x="14.0" y="82.0" font-size="9.6" font-weight="600" fill="#13283f" text-anchor="start">1-hour tokens, long-lived issuer</text><text x="14.0" y="95.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">isolated issuer refreshes for 30 days</text><path d="M236.0,74.0 L582.4,74.0 Q586.4,74.0 586.4,78.0 L586.4,88.0 Q586.4,92.0 582.4,92.0 L236.0,92.0 Z" fill="#a9b4bf" /><text x="592.4" y="86.8" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="start">30 d</text><text x="14.0" y="122.0" font-size="9.6" font-weight="600" fill="#13283f" text-anchor="start">1-hour permits, 5-minute issuer lease</text><text x="14.0" y="135.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">only the permit is checked at use</text><path d="M236.0,114.0 L428.2,114.0 Q432.2,114.0 432.2,118.0 L432.2,128.0 Q432.2,132.0 428.2,132.0 L236.0,132.0 Z" fill="#a9b4bf" /><text x="438.2" y="126.8" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="start">65 min</text><text x="14.0" y="162.0" font-size="9.6" font-weight="600" fill="#13283f" text-anchor="start">Same, with nested expiry</text><text x="14.0" y="175.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">permit cannot outlive its issuer</text><path d="M236.0,154.0 L367.8,154.0 Q371.8,154.0 371.8,158.0 L371.8,168.0 Q371.8,172.0 367.8,172.0 L236.0,172.0 Z" fill="#00958c" /><text x="377.8" y="166.8" font-size="9.4" font-weight="600" fill="#13283f" text-anchor="start">5 min</text><text x="14.0" y="202.0" font-size="9.6" font-weight="600" fill="#13283f" text-anchor="start">Push revocation working</text><text x="14.0" y="215.0" font-size="8.2" font-weight="400" fill="#7b8794" text-anchor="start">p99 event-application objective</text><path d="M236.0,194.0 L286.6,194.0 Q290.6,194.0 290.